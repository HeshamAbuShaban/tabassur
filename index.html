<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABASSUR - تَبَصُّر</title>
    
    <!-- Google Fonts: Amiri for elegant Arabic typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Amiri', serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem 2rem;
        }

        .verse-container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 3s ease-out forwards;
            animation-delay: 0.5s;
        }

        .verse-text {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 700;
            color: #f8f9fa;
            text-shadow: 
                0 0 10px rgba(255, 215, 0, 0.6),
                0 0 20px rgba(255, 215, 0, 0.4),
                0 0 30px rgba(147, 112, 219, 0.3);
            letter-spacing: 2px;
            line-height: 1.8;
            backdrop-filter: blur(4px);
            padding: 1rem 2rem;
            background: linear-gradient(
                180deg, 
                rgba(2, 2, 8, 0.6) 0%, 
                rgba(2, 2, 8, 0.3) 50%, 
                rgba(2, 2, 8, 0.6) 100%
            );
            border-radius: 16px;
            display: inline-block;
        }

        .info-container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 3s ease-out forwards;
            animation-delay: 2s;
        }

        .info-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            font-style: italic;
            color: rgba(200, 200, 220, 0.8);
            text-shadow: 0 0 10px rgba(147, 112, 219, 0.4);
            letter-spacing: 1px;
            backdrop-filter: blur(2px);
            padding: 0.5rem 1.5rem;
            background: linear-gradient(
                180deg, 
                rgba(2, 2, 8, 0.4) 0%, 
                rgba(2, 2, 8, 0.2) 100%
            );
            border-radius: 8px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading indicator */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            color: #f8f9fa;
            font-size: 1.2rem;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Loading Indicator -->
    <div class="loading" id="loading">جاري التحميل...</div>

    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div class="ui-overlay">
        <div class="verse-container">
            <div class="verse-text">
                وَالسَّمَاءَ بَنَيْنَاهَا بِأَيْدٍ وَإِنَّا لَمُوسِعُونَ
            </div>
        </div>
        
        <div class="info-container">
            <div class="info-text">
                أكبر بنية في الكون تمتد على ملايين السنين الضوئية.. تأمل صامت.
            </div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module" src="/main.js"></script>
</body>
</html>
