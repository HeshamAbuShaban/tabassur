<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="تَبَصُّر - An immersive contemplation journey through the cosmos">
    <title>تَبَصُّر | Tabassur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Noto Sans Arabic', sans-serif;
            touch-action: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #ui-layer > * {
            pointer-events: auto;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .title-group h1 {
            font-family: 'Amiri', serif;
            font-size: 28px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .title-group .subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-top: 4px;
        }

        .journey-toggle {
            display: flex;
            gap: 8px;
        }

        .journey-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.5);
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .journey-btn.active {
            background: rgba(100, 150, 255, 0.3);
            border-color: rgba(100, 150, 255, 0.6);
            color: #fff;
        }

        /* Time Slider */
        .time-controls {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            padding: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .time-label {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .time-value {
            font-family: 'Amiri', serif;
            font-size: 18px;
            color: #6496ff;
            text-align: center;
            margin-bottom: 8px;
        }

        .slider-container {
            position: relative;
            height: 40px;
        }

        .time-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            outline: none;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .time-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #6496ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
        }

        .time-ticks {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .tick {
            position: absolute;
            bottom: 0;
            width: 1px;
            height: 8px;
            background: rgba(255,255,255,0.3);
        }

        .tick-label {
            position: absolute;
            bottom: -20px;
            transform: translateX(-50%);
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            white-space: nowrap;
        }

        /* Contemplative Overlay */
        .contemplation-panel {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            max-width: 320px;
            padding: 24px;
            background: rgba(0,0,0,0.85);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .contemplation-panel.visible {
            opacity: 1;
        }

        .verse-arabic {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: #ffd700;
            line-height: 2;
            text-align: right;
            margin-bottom: 16px;
        }

        .verse-reference {
            font-size: 12px;
            color: rgba(255,215,0,0.7);
            text-align: left;
            margin-bottom: 20px;
        }

        .tafsir-section {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 16px;
            margin-bottom: 16px;
        }

        .tafsir-title {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .tafsir-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            line-height: 1.8;
            text-align: right;
        }

        .science-fact {
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 16px;
        }

        .fact-label {
            font-size: 11px;
            color: #6496ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .fact-text {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }

        .simulation-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 16px;
            font-style: italic;
        }

        /* Reflection Input */
        .reflection-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .reflection-input {
            width: 100%;
            min-height: 80px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-family: 'Noto Sans Arabic', sans-serif;
            font-size: 13px;
            resize: none;
        }

        .reflection-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .privacy-note {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-top: 8px;
            text-align: center;
        }

        /* Scale Indicator */
        .scale-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .scale-value {
            font-family: 'Amiri', serif;
            font-size: 16px;
            color: #6496ff;
        }

        /* FPS Counter */
        #fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 8px 12px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            font-size: 12px;
            color: #0f0;
            font-family: monospace;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-title {
            font-family: 'Amiri', serif;
            font-size: 32px;
            color: #fff;
            margin-bottom: 20px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: #6496ff;
            width: 0%;
            transition: width 0.3s ease;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 13px;
            color: rgba(255,255,255,0.5);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .contemplation-panel {
                top: auto;
                bottom: 180px;
                right: 10px;
                left: 10px;
                max-width: none;
                transform: none;
            }

            .verse-arabic {
                font-size: 18px;
            }

            .time-controls {
                bottom: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <h1 class="loading-title">تَبَصُّر</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loading-progress"></div>
        </div>
        <p class="loading-text" id="loading-text">جاري تحميل البيانات...</p>
    </div>

    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Header -->
        <div class="header">
            <div class="title-group">
                <h1>تَبَصُّر</h1>
                <p class="subtitle">رحلة في الآفاق والأنفس</p>
            </div>
            <div class="journey-toggle">
                <button class="journey-btn active" data-journey="afaq">الآفاق</button>
                <button class="journey-btn" data-journey="anfus">الأنفس</button>
            </div>
        </div>

        <!-- Contemplation Panel -->
        <div class="contemplation-panel" id="contemplation-panel">
            <div class="verse-arabic" id="verse-arabic"></div>
            <div class="verse-reference" id="verse-reference"></div>
            
            <div class="tafsir-section">
                <div class="tafsir-title">من التفسير</div>
                <div class="tafsir-text" id="tafsir-text"></div>
            </div>

            <div class="science-fact">
                <div class="fact-label">حقيقة علمية</div>
                <div class="fact-text" id="fact-text"></div>
            </div>

            <div class="simulation-label">محاكاة علمية تقريبية</div>

            <div class="reflection-section">
                <textarea class="reflection-input" id="reflection-input" placeholder="اكتب تأملاتك الخاصة..."></textarea>
                <p class="privacy-note">تأملاتك تبقى على جهازك فقط</p>
            </div>
        </div>

        <!-- Time Controls -->
        <div class="time-controls">
            <div class="time-label">الزمن الكوني</div>
            <div class="time-value" id="time-value">13.8 مليار سنة</div>
            <div class="slider-container">
                <input type="range" class="time-slider" id="time-slider" min="-43" max="100" value="10" step="0.1">
                <div class="time-ticks" id="time-ticks"></div>
            </div>
        </div>

        <!-- Scale Indicator -->
        <div class="scale-indicator">
            <div>المقياس الحالي</div>
            <div class="scale-value" id="scale-value">10<sup>26</sup> متر</div>
        </div>

        <!-- FPS Counter -->
        <div id="fps-counter">FPS: 60</div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
